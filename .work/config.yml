# Machine-readable settings. The agent file (CLAUDE.md / AGENTS.md) carries
# policy only. Scripts read THIS file.
version: 1

project:
  key: WTUI
  name: "WikiTicket UI"

ticketing:
  system: github               # sync is skill-based (ticket-sync); no adapter binary
  project: SpillwaveSolutions/wiki_ticket_sdd_ui

wiki:
  system: github-wiki          # publishing is skill-based (wiki-publish); no adapter binary
  root_url: https://github.com/SpillwaveSolutions/wiki_ticket_sdd_ui/wiki

features:
  auto_merge_on_green: true    # false = advisory: poll, report green, human merges

release:
  sync_docs:            # docs regenerated by background agents at every release
    - design-doc        # docs/designs/current_design_doc.md + dated freeze
    - code-walkthrough  # docs/designs/current_code_walkthrough.md + dated freeze
    - user-guide        # docs/user_guide/*.md refreshed against diff since last tag
    - readme            # README.md same

paths:
  plans: docs/plans
  status: docs/status
  roadmap: docs/roadmap.md
installed: 0.12.1
