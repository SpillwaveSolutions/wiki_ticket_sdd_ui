name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Fixture-driven parity tests shell out to npx tsx server/test/build-fixture.ts
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml
