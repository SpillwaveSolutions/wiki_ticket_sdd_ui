# Application quality gate. Deliberately NOT part of worklog.yml: that file is
# scaffolded and re-copied by `worklog init`, so the next upgrade would silently
# delete these jobs. Tool-owned file stays tool-owned.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # withGlobalTauri ships window.__TAURI__ in RELEASE builds; api.ts / isTauri()
      # sniff that global. It must live only in a local dev overlay, never here.
      - name: withGlobalTauri stays out of the committed Tauri config
        run: |
          if grep -q withGlobalTauri src-tauri/tauri.conf.json; then
            echo "::error file=src-tauri/tauri.conf.json::withGlobalTauri must not appear in the committed config"
            exit 1
          fi
      # Dev ports are resolved by scripts/dev-ports.mjs. A CLI --port or a
      # literal Vite bind that reintroduces 5173/8080 as the only option is
      # what makes sibling Spillwave apps fight on one machine.
      - name: no fixed-port flags that defeat the resolver
        run: |
          if grep -nE -- '--port[[:space:]]+(5173|8080)\b' package.json scripts/* 2>/dev/null; then
            echo "::error::do not pin Vite/API with --port 5173|8080; use scripts/dev-ports.mjs"
            exit 1
          fi
          if grep -nE 'strictPort:\s*false' web/vite.config.ts 2>/dev/null; then
            echo "::error file=web/vite.config.ts::strictPort must stay true so a bind failure is loud"
            exit 1
          fi

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Fixture-driven parity tests shell out to npx tsx server/test/build-fixture.ts
      - run: npm ci
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev libsoup-3.0-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm run test:rust
