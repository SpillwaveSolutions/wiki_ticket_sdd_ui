[package]
name = "wiki-ticket-ui"
version = "0.1.0"
description = "Local read-only dashboard for any WikiTicket SDD (worklog) repo"
authors = ["Spillwave"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
